dependencies:
  idf: ">=5.4.0"
  espressif/esp_video: "^1.0.0"            # V4L2 camera stack + OV5640 driver (esp_cam_sensor)
  espressif/esp_websocket_client: "^1.2.0"
  espressif/esp_codec_dev: "^1.3.0"        # ES8311 speaker codec
  # The P4 has no radio — WiFi goes through the onboard ESP32-C6 over SDIO.
  espressif/esp_wifi_remote:
    version: ">=0.10.0"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_hosted:
    version: ">=2.0.0"
    rules:
      - if: "target in [esp32p4]"
